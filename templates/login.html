{% extends 'base.html' %}
{% block title %}Login — AI-SMS{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-5">
        <div class="text-center mb-4">
          <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 24px;">
            <i class="bi bi-shield-lock"></i>
          </div>
          <h3 class="fw-bold">AI-SMS Login</h3>
          <p class="text-muted">Sign in to access the decision support system.</p>
        </div>
        
        <form method="POST" action="{{ url_for('login') }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input type="text" name="username" class="form-control" placeholder="Enter username" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 mt-2">
            Sign In <i class="bi bi-box-arrow-in-right ms-1"></i>
          </button>
        </form>
        
        <div class="mt-4 text-center text-muted small">
          <strong>Demo Accounts:</strong><br>
          Leader: <code>leader</code> / <code>leader123</code><br>
          Admin: <code>admin</code> / <code>admin123</code>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
